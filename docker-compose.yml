services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ecommerce_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ecommerce_db
      DB_USER: ecommerce
      DB_PASSWORD: password123
      PORT: "8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Code Challenge E-Commerce.csv:/app/Code Challenge E-Commerce.csv

volumes:
  pgdata: